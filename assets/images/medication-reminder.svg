<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bellGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="bellShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Glowing Sound / Pulse Waves -->
  <circle cx="170" cy="120" r="105" stroke="#BFDBFE" stroke-width="1.5" stroke-dasharray="4 4" fill="#EFF6FF" fill-opacity="0.4"/>
  <circle cx="170" cy="120" r="80" stroke="#93C5FD" stroke-width="2" fill="#DBEAFE" fill-opacity="0.3"/>

  <!-- Big Floating Notification Bell -->
  <g transform="translate(120, 60)" filter="url(#bellShadow)">
    <path d="M 50 15 C 32 15 25 28 25 55 L 18 72 C 16 76 18 80 24 80 L 76 80 C 82 80 84 76 82 72 L 75 55 C 75 28 68 15 50 15 Z" fill="url(#bellGrad)"/>
    <circle cx="50" cy="12" r="5" fill="#1D4ED8"/>
    <circle cx="50" cy="85" r="8" fill="#F59E0B"/>
    <!-- Bell highlight -->
    <path d="M 38 30 C 38 24 45 22 48 22" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Floating Digital Clock Pill Badge -->
  <g transform="translate(180, 150)" filter="url(#bellShadow)">
    <rect width="130" height="42" rx="21" fill="#142B4A" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="10" fill="#10B981"/>
    <path d="M18 21 L21 24 L26 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="38" y="26" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">08:00 AM</text>
  </g>

  <!-- Floating Pill Capsule -->
  <g transform="translate(45, 100) rotate(-35)" filter="url(#bellShadow)">
    <rect width="24" height="52" rx="12" fill="#2563EB"/>
    <path d="M0 26 L24 26 L24 40 C24 46.6 18.6 52 12 52 C5.4 52 0 46.6 0 40 Z" fill="#93C5FD"/>
    <line x1="0" y1="26" x2="24" y2="26" stroke="#1D4ED8" stroke-width="1.5"/>
  </g>

  <!-- Sparkles -->
  <g transform="translate(260, 45)">
    <path d="M10 0 L12 6 L18 8 L12 10 L10 16 L8 10 L2 8 L8 6 Z" fill="#F59E0B"/>
  </g>
  <g transform="translate(60, 40)">
    <path d="M8 0 L10 5 L15 6 L10 8 L8 13 L6 8 L1 6 L6 5 Z" fill="#60A5FA"/>
  </g>
</svg>

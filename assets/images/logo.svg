<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="meditrackLogoGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <filter id="logoShadow" x="0" y="2" width="48" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#meditrackLogoGrad)" filter="url(#logoShadow)"/>
  
  <!-- Subtle Cross in background -->
  <rect x="20.5" y="11" width="7" height="26" rx="3.5" fill="#FFFFFF" fill-opacity="0.22" />
  <rect x="11" y="20.5" width="26" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.22" />
  
  <!-- Pill Capsule at 45 degree angle -->
  <g transform="rotate(-45 24 24)">
    <!-- Pill top half -->
    <path d="M19 14 C19 10.134 22.134 7 26 7 C29.866 7 33 10.134 33 14 L33 24 L19 24 Z" fill="#FFFFFF" />
    <!-- Pill bottom half -->
    <path d="M19 24 L33 24 L33 34 C33 37.866 29.866 41 26 41 C22.134 41 19 37.866 19 34 Z" fill="#93C5FD" />
    <!-- Pill division line -->
    <line x1="19" y1="24" x2="33" y2="24" stroke="#2563EB" stroke-width="1.5" />
    <!-- Pill shine -->
    <path d="M22 11 C22 9.5 23.5 8.5 25 8.5" stroke="#BFDBFE" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <!-- Active Pulse Dot -->
  <circle cx="36" cy="12" r="3.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>

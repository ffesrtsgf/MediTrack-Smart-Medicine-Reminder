<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" fill="none" role="img" aria-label="Healthcare illustration of a patient managing medication with a doctor and calendar">
  <defs>
    <linearGradient id="authPanelGrad" x1="0" y1="0" x2="480" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087E8B"/>
      <stop offset="1" stop-color="#176B87"/>
    </linearGradient>
    <linearGradient id="authCardGrad" x1="0" y1="0" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F4F9FC"/>
    </linearGradient>
    <linearGradient id="authPillGrad" x1="0" y1="0" x2="70" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087E8B"/>
      <stop offset="1" stop-color="#176B87"/>
    </linearGradient>
  </defs>

  <!-- Full panel background -->
  <rect width="480" height="520" fill="url(#authPanelGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="80" cy="80" r="120" fill="#ffffff" opacity="0.06"/>
  <circle cx="420" cy="460" r="140" fill="#D9F3E8" opacity="0.08"/>
  <circle cx="400" cy="100" r="60" fill="#D9F3E8" opacity="0.1"/>
  <circle cx="60" cy="420" r="70" fill="#ffffff" opacity="0.05"/>

  <!-- Dashed ring accent -->
  <circle cx="240" cy="240" r="160" fill="none" stroke="#D9F3E8" stroke-width="1.5" stroke-dasharray="5 8" opacity="0.35"/>

  <!-- Central medical card -->
  <g transform="translate(120 150)">
    <rect x="0" y="0" width="240" height="180" rx="20" fill="url(#authCardGrad)"/>
    <rect x="0" y="0" width="240" height="180" rx="20" fill="none" stroke="#087E8B" stroke-width="2" opacity="0.15"/>

    <!-- Heart pulse line -->
    <path d="M24 70h24l10-22 16 40 11-26 8 14h28" stroke="#087E8B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Pill row -->
    <g transform="translate(24 100)">
      <rect x="0" y="0" width="40" height="20" rx="10" fill="#D9F3E8" stroke="#176B87" stroke-width="1.5"/>
      <rect x="20" y="0" width="20" height="20" rx="10" fill="url(#authPillGrad)"/>
    </g>
    <g transform="translate(74 100)">
      <circle cx="12" cy="12" r="12" fill="#ffffff" stroke="#176B87" stroke-width="2"/>
      <path d="M12 6v6l5 3" stroke="#087E8B" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(110 100)">
      <rect x="0" y="2" width="22" height="20" rx="4" fill="#ffffff" stroke="#176B87" stroke-width="1.5"/>
      <rect x="3" y="0" width="16" height="6" rx="2" fill="#087E8B"/>
      <path d="M5 9h12M5 13h12M5 17h8" stroke="#087E8B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(150 100)">
      <path d="M12 2l5 14-12 0z" fill="#D9F3E8" stroke="#176B87" stroke-width="1.5" transform="rotate(35 12 12)"/>
    </g>

    <!-- Checkmark badge -->
    <g transform="translate(170 130)">
      <circle cx="20" cy="20" r="20" fill="#D9F3E8" stroke="#087E8B" stroke-width="2"/>
      <path d="M11 20l6 6 12-13" stroke="#087E8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Bottom labels -->
    <rect x="24" y="140" width="60" height="8" rx="4" fill="#176B87" opacity="0.2"/>
    <rect x="24" y="154" width="100" height="6" rx="3" fill="#176B87" opacity="0.12"/>
  </g>

  <!-- Floating calendar top-right -->
  <g transform="translate(350 60)">
    <rect x="0" y="8" width="70" height="64" rx="10" fill="#ffffff" opacity="0.95"/>
    <rect x="0" y="8" width="70" height="18" rx="10" fill="#087E8B"/>
    <rect x="0" y="20" width="70" height="6" fill="#087E8B"/>
    <rect x="12" y="2" width="6" height="14" rx="3" fill="#176B87"/>
    <rect x="52" y="2" width="6" height="14" rx="3" fill="#176B87"/>
    <rect x="14" y="34" width="10" height="10" rx="2" fill="#D9F3E8"/>
    <rect x="30" y="34" width="10" height="10" rx="2" fill="#D9F3E8"/>
    <rect x="46" y="34" width="10" height="10" rx="2" fill="#087E8B"/>
    <rect x="14" y="50" width="10" height="10" rx="2" fill="#D9F3E8"/>
    <rect x="30" y="50" width="10" height="10" rx="2" fill="#087E8B"/>
    <rect x="46" y="50" width="10" height="10" rx="2" fill="#D9F3E8"/>
  </g>

  <!-- Bell notification bottom-right -->
  <g transform="translate(370 360)">
    <circle cx="34" cy="34" r="34" fill="#D9F3E8" opacity="0.18"/>
    <path d="M34 16a10 10 0 0 1 10 10v8c0 4 2 6 2 6H22s2-2 2-6v-8a10 10 0 0 1 10-10z" fill="#ffffff"/>
    <path d="M30 48a4 4 0 0 0 8 0" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="20" r="6" fill="#D9F3E8"/>
  </g>

  <!-- Plus medical cross bottom-left -->
  <g transform="translate(50 350)">
    <circle cx="30" cy="30" r="30" fill="#ffffff" opacity="0.15"/>
    <rect x="26" y="16" width="8" height="28" rx="2" fill="#ffffff"/>
    <rect x="16" y="26" width="28" height="8" rx="2" fill="#ffffff"/>
  </g>

  <!-- Brand tagline area -->
  <g transform="translate(140 420)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">MediTrack</text>
    <text x="2" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#D9F3E8" opacity="0.9">Smart Medicine Reminder</text>
  </g>
</svg>

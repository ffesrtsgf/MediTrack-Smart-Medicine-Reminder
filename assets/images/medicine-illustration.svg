<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="medIllBg" x1="0" y1="0" x2="460" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#142B4A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="pillGrad1" x1="0" y1="0" x2="40" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0" y1="0" x2="40" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3B82F6" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadow" x="-10" y="0" width="220" height="180">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Healthcare Navy Background with Ambient Lights -->
  <rect width="460" height="380" rx="24" fill="url(#medIllBg)" />
  <circle cx="360" cy="80" r="140" fill="#2563EB" fill-opacity="0.2" filter="url(#glow)"/>
  <circle cx="90" cy="310" r="100" fill="#10B981" fill-opacity="0.15"/>

  <!-- Calendar Schedule Card (Floating Left) -->
  <g transform="translate(45, 50)" filter="url(#cardShadow)">
    <rect width="170" height="145" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <!-- Card Header -->
    <rect x="0" y="0" width="170" height="38" rx="16" fill="#2563EB"/>
    <text x="20" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Daily Routine</text>
    <circle cx="150" cy="19" r="4" fill="#10B981"/>
    
    <!-- Checklist items -->
    <g transform="translate(16, 52)">
      <circle cx="10" cy="10" r="8" fill="#10B981"/>
      <path d="M7 10 L9 12 L13 8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="26" y="6" width="70" height="8" rx="4" fill="#E2E8F0"/>
      <text x="105" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="600" fill="#94A3B8">08:00 AM</text>
    </g>

    <g transform="translate(16, 78)">
      <circle cx="10" cy="10" r="8" fill="#10B981"/>
      <path d="M7 10 L9 12 L13 8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="26" y="6" width="60" height="8" rx="4" fill="#E2E8F0"/>
      <text x="105" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="600" fill="#94A3B8">12:30 PM</text>
    </g>

    <g transform="translate(16, 104)">
      <circle cx="10" cy="10" r="8" fill="#F59E0B" fill-opacity="0.3"/>
      <circle cx="10" cy="10" r="4" fill="#F59E0B"/>
      <rect x="26" y="6" width="65" height="8" rx="4" fill="#94A3B8"/>
      <text x="105" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FBBF24">08:00 PM</text>
    </g>
  </g>

  <!-- Big Blister Pack of Capsules (Center) -->
  <g transform="translate(235, 120)" filter="url(#cardShadow)">
    <rect width="180" height="135" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Grid foil lines -->
    <line x1="90" y1="0" x2="90" y2="135" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="0" y1="67" x2="180" y2="67" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Blister 1 -->
    <g transform="translate(25, 20)">
      <rect width="40" height="28" rx="14" fill="#EFF6FF" stroke="#93C5FD"/>
      <rect x="2" y="2" width="18" height="24" rx="9" fill="#2563EB"/>
      <rect x="20" y="2" width="18" height="24" rx="9" fill="#93C5FD"/>
    </g>
    <!-- Blister 2 (Taken / empty foil) -->
    <g transform="translate(115, 20)">
      <rect width="40" height="28" rx="14" fill="#E2E8F0" stroke="#94A3B8" stroke-dasharray="2 2"/>
      <circle cx="20" cy="14" r="8" fill="#CBD5E1"/>
    </g>
    <!-- Blister 3 -->
    <g transform="translate(25, 87)">
      <rect width="40" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
      <rect x="2" y="2" width="18" height="24" rx="9" fill="#10B981"/>
      <rect x="20" y="2" width="18" height="24" rx="9" fill="#A7F3D0"/>
    </g>
    <!-- Blister 4 -->
    <g transform="translate(115, 87)">
      <rect width="40" height="28" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
      <rect x="2" y="2" width="18" height="24" rx="9" fill="#F59E0B"/>
      <rect x="20" y="2" width="18" height="24" rx="9" fill="#FDE68A"/>
    </g>
  </g>

  <!-- Prescription Bottle (Foreground Left) -->
  <g transform="translate(70, 210)" filter="url(#cardShadow)">
    <rect width="84" height="120" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Bottle Cap -->
    <rect x="16" y="-12" width="52" height="16" rx="5" fill="#2563EB"/>
    <!-- Label -->
    <rect x="10" y="28" width="64" height="66" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <!-- Medicine Cross -->
    <rect x="36" y="44" width="12" height="24" rx="3" fill="#2563EB"/>
    <rect x="30" y="50" width="24" height="12" rx="3" fill="#2563EB"/>
    <text x="42" y="83" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="700" fill="#1E3A8A" text-anchor="middle">500 MG</text>
  </g>

  <!-- Floating 3D Pills in Air -->
  <g transform="translate(370, 45) rotate(32)" filter="url(#glow)">
    <rect width="24" height="50" rx="12" fill="#2563EB"/>
    <path d="M0 25 L24 25 L24 38 C24 44.6 18.6 50 12 50 C5.4 50 0 44.6 0 38 Z" fill="#93C5FD"/>
    <line x1="0" y1="25" x2="24" y2="25" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <g transform="translate(20, 260) rotate(-40)" filter="url(#glow)">
    <circle cx="18" cy="18" r="16" fill="#F59E0B"/>
    <line x1="8" y1="18" x2="28" y2="18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Smart Clock Badge Floating Bottom Right -->
  <g transform="translate(250, 280)" filter="url(#cardShadow)">
    <rect width="165" height="52" rx="26" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="28" cy="26" r="16" fill="#2563EB"/>
    <!-- Clock Hands -->
    <path d="M28 17 L28 26 L34 26" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="54" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="800" fill="#142B4A">Smart Reminders</text>
    <text x="54" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600" fill="#10B981">● Active on this device</text>
  </g>
</svg>

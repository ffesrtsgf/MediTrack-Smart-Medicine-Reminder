<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" fill="none" role="img" aria-label="Healthcare illustration with medicine bottle, clock and heart pulse">
  <defs>
    <linearGradient id="heroBgGrad" x1="0" y1="0" x2="360" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9F3E8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F4F9FC" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="heroCircleGrad" x1="0" y1="0" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#176B87"/>
      <stop offset="1" stop-color="#087E8B"/>
    </linearGradient>
    <linearGradient id="heroPillGrad" x1="0" y1="0" x2="60" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087E8B"/>
      <stop offset="1" stop-color="#176B87"/>
    </linearGradient>
  </defs>

  <!-- Soft background blob -->
  <ellipse cx="180" cy="140" rx="170" ry="120" fill="url(#heroBgGrad)"/>

  <!-- Outer decorative dashed ring -->
  <circle cx="180" cy="130" r="92" fill="none" stroke="#087E8B" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.35"/>

  <!-- Central circle with heart pulse -->
  <circle cx="180" cy="130" r="70" fill="url(#heroCircleGrad)"/>
  <path d="M140 132h14l6-16 10 28 7-20 5 8h18" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Pill bottle top-left -->
  <g transform="translate(48 70)">
    <rect x="0" y="12" width="48" height="58" rx="8" fill="#ffffff" stroke="#176B87" stroke-width="2.5"/>
    <rect x="6" y="4" width="36" height="12" rx="3" fill="#087E8B"/>
    <rect x="8" y="30" width="32" height="20" rx="4" fill="#D9F3E8"/>
    <path d="M16 40h16M16 46h10" stroke="#087E8B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Capsule top-right -->
  <g transform="translate(262 64) rotate(35)">
    <rect x="0" y="0" width="56" height="22" rx="11" fill="#D9F3E8" stroke="#176B87" stroke-width="2"/>
    <rect x="28" y="0" width="28" height="22" rx="11" fill="url(#heroPillGrad)"/>
  </g>

  <!-- Clock bottom-right -->
  <g transform="translate(252 176)">
    <circle cx="24" cy="24" r="24" fill="#ffffff" stroke="#176B87" stroke-width="2.5"/>
    <circle cx="24" cy="24" r="24" fill="#D9F3E8" opacity="0.4"/>
    <path d="M24 12v12l9 5" stroke="#087E8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="24" r="2.5" fill="#176B87"/>
  </g>

  <!-- Checkmark badge bottom-left -->
  <g transform="translate(64 180)">
    <circle cx="22" cy="22" r="22" fill="#D9F3E8" stroke="#087E8B" stroke-width="2"/>
    <path d="M13 22l6 6 12-13" stroke="#087E8B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small floating dots -->
  <circle cx="120" cy="50" r="4" fill="#176B87" opacity="0.3"/>
  <circle cx="250" cy="50" r="3" fill="#087E8B" opacity="0.4"/>
  <circle cx="300" cy="140" r="5" fill="#176B87" opacity="0.25"/>
  <circle cx="50" cy="160" r="4" fill="#087E8B" opacity="0.3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="520" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="180" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="softShadow" x="-10" y="-5" width="200" height="140" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E3A8A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient background glow & circles -->
  <circle cx="440" cy="80" r="120" fill="#BFDBFE" fill-opacity="0.3" />
  <circle cx="80" cy="280" r="90" fill="#93C5FD" fill-opacity="0.25" />
  <rect x="20" y="20" width="480" height="320" rx="24" fill="url(#heroBg)" fill-opacity="0.7"/>

  <!-- Decorative Medical Grid & Waves -->
  <path d="M40 260 C 140 220, 220 300, 340 240 C 420 200, 460 260, 480 230" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
  
  <!-- Digital Tablet / Health Dashboard Mockup -->
  <g transform="translate(190, 45)" filter="url(#softShadow)">
    <rect width="260" height="175" rx="16" fill="#142B4A" stroke="#2563EB" stroke-width="2"/>
    <!-- Tablet Header -->
    <rect x="15" y="14" width="70" height="8" rx="4" fill="#3B82F6"/>
    <circle cx="235" cy="18" r="5" fill="#10B981"/>
    <!-- Dashboard card 1 -->
    <rect x="15" y="34" width="105" height="58" rx="8" fill="#1E3A8A"/>
    <circle cx="32" cy="50" r="9" fill="#2563EB"/>
    <path d="M29 50 L32 53 L37 47" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <rect x="47" y="44" width="60" height="6" rx="3" fill="#BFDBFE"/>
    <rect x="47" y="55" width="40" height="5" rx="2.5" fill="#93C5FD" fill-opacity="0.6"/>
    <rect x="25" y="72" width="85" height="12" rx="4" fill="#10B981" fill-opacity="0.2"/>
    <text x="67" y="81" font-family="-apple-system, system-ui, sans-serif" font-size="8" font-weight="700" fill="#34D399" text-anchor="middle">TAKEN 08:00 AM</text>

    <!-- Dashboard card 2 -->
    <rect x="135" y="34" width="110" height="58" rx="8" fill="#1E3A8A"/>
    <circle cx="152" cy="50" r="9" fill="#F59E0B" fill-opacity="0.3"/>
    <circle cx="152" cy="50" r="4" fill="#F59E0B"/>
    <rect x="167" y="44" width="65" height="6" rx="3" fill="#BFDBFE"/>
    <rect x="167" y="55" width="45" height="5" rx="2.5" fill="#93C5FD" fill-opacity="0.6"/>
    <rect x="145" y="72" width="90" height="12" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="190" y="81" font-family="-apple-system, system-ui, sans-serif" font-size="8" font-weight="700" fill="#FBBF24" text-anchor="middle">UPCOMING 01:00 PM</text>

    <!-- Adherence bar -->
    <rect x="15" y="106" width="230" height="48" rx="8" fill="#0F172A"/>
    <text x="25" y="122" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-weight="700" fill="#E2E8F0">Today's Adherence Rate: 85%</text>
    <rect x="25" y="130" width="210" height="8" rx="4" fill="#334155"/>
    <rect x="25" y="130" width="178" height="8" rx="4" fill="#2563EB"/>
  </g>

  <!-- Friendly Elderly Patient & Nurse / Doctor Character silhouettes & shapes -->
  <g id="doctorNurse">
    <!-- Doctor body -->
    <path d="M 60 310 C 60 250, 75 220, 115 210 C 120 240, 145 240, 150 210 C 185 220, 205 250, 205 310 Z" fill="#2563EB"/>
    <!-- Doctor coat lapel -->
    <path d="M 115 210 L 132 270 L 150 210 Z" fill="#EFF6FF"/>
    <path d="M 132 230 L 132 310" stroke="#1D4ED8" stroke-width="2"/>
    <!-- Stethoscope -->
    <path d="M 120 220 C 120 250, 145 250, 145 220" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="132.5" cy="256" r="6" fill="#142B4A" stroke="#60A5FA" stroke-width="2"/>
    <!-- Doctor Head -->
    <circle cx="132.5" cy="165" r="28" fill="#FCD34D"/>
    <!-- Hair -->
    <path d="M 106 160 C 106 130, 160 130, 160 160 C 150 145, 120 145, 106 160 Z" fill="#1E293B"/>
    <!-- Kind smiling eyes & mask / smile -->
    <circle cx="124" cy="162" r="3" fill="#1E293B"/>
    <circle cx="142" cy="162" r="3" fill="#1E293B"/>
    <path d="M 125 174 Q 133 182 141 174" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Friendly Senior Patient -->
  <g id="seniorPatient">
    <!-- Body in cozy cardigan -->
    <path d="M 230 320 C 230 265, 248 240, 280 230 C 285 255, 305 255, 310 230 C 340 240, 360 265, 360 320 Z" fill="#10B981"/>
    <path d="M 280 230 L 295 270 L 310 230" fill="#ECFDF5"/>
    <!-- Head -->
    <circle cx="295" cy="175" r="26" fill="#FDE68A"/>
    <!-- Silver grey hair -->
    <path d="M 270 170 C 270 138, 320 138, 320 170 C 315 152, 285 152, 270 170 Z" fill="#94A3B8"/>
    <!-- Glasses -->
    <circle cx="288" cy="173" r="6" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="304" cy="173" r="6" stroke="#475569" stroke-width="2" fill="none"/>
    <line x1="294" y1="173" x2="298" y2="173" stroke="#475569" stroke-width="2"/>
    <!-- Gentle smile -->
    <path d="M 290 186 Q 296 191 302 186" stroke="#475569" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Floating Health Icons / Pills & Badges -->
  <!-- Medicine Bottle -->
  <g transform="translate(420, 215)" filter="url(#softShadow)">
    <rect width="64" height="85" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="14" y="-8" width="36" height="12" rx="4" fill="#2563EB"/>
    <rect x="8" y="24" width="48" height="42" rx="6" fill="#EFF6FF"/>
    <rect x="18" y="36" width="28" height="6" rx="3" fill="#2563EB"/>
    <rect x="23" y="48" width="18" height="4" rx="2" fill="#93C5FD"/>
    <!-- Cross on bottle -->
    <circle cx="32" cy="58" r="8" fill="#10B981"/>
    <path d="M29 58 L35 58 M32 55 L32 61" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Large floating 3D Pill capsule -->
  <g transform="translate(60, 60) rotate(-28)">
    <rect x="0" y="0" width="26" height="52" rx="13" fill="#2563EB" filter="url(#softShadow)"/>
    <path d="M0 26 L26 26 L26 39 C26 46.17 20.17 52 13 52 C5.83 52 0 46.17 0 39 Z" fill="#93C5FD"/>
    <line x1="0" y1="26" x2="26" y2="26" stroke="#1D4ED8" stroke-width="1.5"/>
  </g>

  <!-- Floating Heart Rate badge -->
  <g transform="translate(35, 170)" filter="url(#softShadow)">
    <rect width="70" height="40" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M12 20 L22 20 L26 12 L32 28 L36 16 L40 22 L58 22" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Smart Reminder Badge Floating Top Right -->
  <g transform="translate(360, 15)" filter="url(#softShadow)">
    <rect width="130" height="38" rx="19" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="10" fill="#F59E0B"/>
    <path d="M17 19 Q20 14 20 17 L23 19 M20 22 L20 23" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="36" y="23" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="700" fill="#142B4A">Next Dose: 08:00 AM</text>
  </g>
</svg>

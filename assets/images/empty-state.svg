<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="emptyBg" x1="0" y1="0" x2="320" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="emptyShadow" x="-10" y="0" width="160" height="180">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Circular background halo -->
  <circle cx="160" cy="120" r="95" fill="url(#emptyBg)" stroke="#BFDBFE" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="160" cy="120" r="70" fill="#FFFFFF"/>

  <!-- Medicine Organizer Tray / Box -->
  <g transform="translate(105, 60)" filter="url(#emptyShadow)">
    <rect width="110" height="110" rx="18" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="12" y="14" width="86" height="82" rx="10" fill="#F0F9FF"/>

    <!-- Pill Bottle sitting inside -->
    <g transform="translate(30, 20)">
      <rect width="50" height="70" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
      <rect x="8" y="-8" width="34" height="10" rx="3" fill="#2563EB"/>
      <rect x="6" y="18" width="38" height="36" rx="6" fill="#EFF6FF"/>
      <!-- Smiling Face on bottle -->
      <circle cx="19" cy="32" r="2.5" fill="#1E3A8A"/>
      <circle cx="31" cy="32" r="2.5" fill="#1E3A8A"/>
      <path d="M21 40 Q25 45 29 40" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Sparkles & Plus Icons -->
  <g transform="translate(65, 80)">
    <path d="M12 0 L14 8 L22 10 L14 12 L12 20 L10 12 L2 10 L10 8 Z" fill="#60A5FA"/>
  </g>
  <g transform="translate(235, 70)">
    <path d="M10 0 L12 6 L18 8 L12 10 L10 16 L8 10 L2 8 L8 6 Z" fill="#F59E0B"/>
  </g>
  <g transform="translate(240, 160)">
    <circle cx="10" cy="10" r="10" fill="#10B981" fill-opacity="0.2"/>
    <path d="M7 10 L13 10 M10 7 L10 13" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(60, 155)">
    <circle cx="10" cy="10" r="10" fill="#3B82F6" fill-opacity="0.2"/>
    <path d="M7 10 L13 10 M10 7 L10 13" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
